<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Limol's Microfinance — Admin Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============ RESET ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;width:100%;}
body{min-height:100vh;overflow-x:hidden;width:100%;position:relative;}
img{max-width:100%;display:block;}
button{font:inherit;cursor:pointer;}
input,select,textarea{font:inherit;}
a{color:inherit;text-decoration:none;}
ul,ol{list-style:none;}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;}

/* ============ TOKENS ============ */
:root{
  --navy-950:#081527;
  --navy-900:#0D2140;
  --navy-800:#14315B;
  --navy-700:#1C4174;
  --navy-600:#28548F;
  --blue-500:#2E6FED;
  --blue-50:#EBF2FE;
  --green-700:#146C48;
  --green-600:#178A5A;
  --green-50:#E9F7EF;
  --red-700:#A82E2E;
  --red-600:#D14343;
  --red-50:#FCECEC;
  --orange-600:#DB7A2C;
  --orange-50:#FDF1E4;
  --gray-25:#FAFBFC;
  --gray-50:#F4F6F8;
  --gray-100:#EDEFF2;
  --gray-200:#E1E4E9;
  --gray-300:#CBD0D9;
  --gray-400:#9AA3B2;
  --gray-500:#6C7688;
  --gray-600:#4E5768;
  --gray-700:#374056;
  --gray-800:#232B3D;
  --gray-900:#12161F;
  --white:#FFFFFF;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:18px;
  --radius-full:999px;
  --shadow-xs:0 1px 2px rgba(13,33,64,0.05);
  --shadow-sm:0 1px 3px rgba(13,33,64,0.07), 0 1px 2px rgba(13,33,64,0.04);
  --shadow-md:0 6px 20px rgba(13,33,64,0.08);
  --shadow-lg:0 16px 40px rgba(13,33,64,0.14);
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}

body{
  font-family:var(--font-body);
  background:var(--gray-50);
  color:var(--gray-800);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-0.01em;}

/* ============ UTILITY ============ */
.hidden{display:none !important;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}

/* ============ LOGO ============ */
.brand-logo{display:flex;align-items:center;gap:10px;}
.brand-mark{width:34px;height:34px;flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:16.5px;color:var(--white);letter-spacing:-0.01em;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--navy-600);letter-spacing:0.06em;text-transform:uppercase;font-weight:600;}
.brand-logo.dark .brand-name{color:var(--navy-900);}

/* ============ APP SHELL ============ */
#app-shell{display:none;min-height:100vh;grid-template-columns:264px 1fr;max-width:100vw;overflow-x:hidden;}
#app-shell.active{display:grid;}

/* Sidebar */
.sidebar{
  background:var(--navy-950);
  padding:22px 16px 20px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{padding:6px 10px 22px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:16px;}
.nav-group-label{font-size:10.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:#5F7196;padding:14px 12px 8px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:var(--radius-sm);
  color:#B9C4DA;font-size:14px;font-weight:500;
  margin-bottom:2px;transition:background .15s,color .15s;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--navy-700);color:#fff;}
.nav-item.active svg{color:#7EB0FF;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,0.08);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);}
.sidebar-user:hover{background:rgba(255,255,255,0.06);cursor:pointer;}
.avatar{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;flex-shrink:0;
}
.sidebar-user-name{font-size:13.5px;font-weight:600;color:#fff;}
.sidebar-user-role{font-size:11.5px;color:#8393B4;}
.logout-btn{display:flex;align-items:center;gap:9px;color:#8393B4;font-size:13px;font-weight:500;padding:9px 8px;width:100%;border:none;background:none;border-radius:var(--radius-sm);margin-top:2px;}
.logout-btn:hover{color:#fff;background:rgba(255,255,255,0.06);}

/* Mobile sidebar drawer */
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(8,21,39,0.5);z-index:40;}
.sidebar-backdrop.active{display:block;}

/* Main column */
.main-col{display:flex;flex-direction:column;min-width:0;max-width:100%;overflow-x:hidden;}
.topbar{
  position:sticky;top:0;z-index:20;
  background:#fff;border-bottom:1px solid var(--gray-200);
  padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
.page-title-mini{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--gray-900);}
.hamburger{display:none;border:none;background:var(--gray-50);border-radius:var(--radius-sm);width:38px;height:38px;align-items:center;justify-content:center;color:var(--gray-700);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--gray-200);
  background:#fff;display:flex;align-items:center;justify-content:center;color:var(--gray-600);
  position:relative;transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:var(--gray-50);border-color:var(--gray-300);}
.notif-dot{position:absolute;top:-4px;right:-4px;background:var(--red-600);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff;font-family:var(--font-body);}
.topbar-avatar-btn{display:flex;align-items:center;gap:9px;border:1px solid var(--gray-200);background:#fff;border-radius:var(--radius-full);padding:5px 12px 5px 5px;}
.topbar-avatar-btn:hover{background:var(--gray-50);}
.topbar-avatar-name{font-size:13px;font-weight:600;color:var(--gray-800);}

.content{padding:26px 28px 60px;max-width:1400px;width:100%;overflow-x:hidden;}

/* Notification dropdown */
.dropdown-panel{
  position:absolute;top:56px;right:28px;width:380px;max-width:calc(100vw - 32px);
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-lg);
  z-index:50;overflow:hidden;
}
.dropdown-panel.hidden{display:none;}
.dropdown-head{padding:14px 16px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between;}
.dropdown-head h4{font-family:var(--font-display);font-size:14.5px;font-weight:700;}
.dropdown-body{max-height:400px;overflow-y:auto;}
.notif-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background .15s;}
.notif-item:hover{background:var(--gray-25);}
.notif-item:last-child{border-bottom:none;}
.notif-ico{width:34px;height:34px;border-radius:50%;background:var(--red-50);color:var(--red-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.notif-text-title{font-size:13.5px;font-weight:600;color:var(--gray-900);}
.notif-text-body{font-size:12.5px;color:var(--gray-500);margin-top:2px;line-height:1.45;}
.dropdown-empty{padding:30px 16px;text-align:center;color:var(--gray-400);font-size:13px;}

/* ============ TYPOGRAPHY HELPERS ============ */
h1,h2,h3,h4{font-family:var(--font-display);color:var(--gray-900);letter-spacing:-0.015em;}
.page-title{font-size:24px;font-weight:700;}
.page-subtitle{color:var(--gray-500);font-size:14px;margin-top:4px;}
.section-title{font-size:16px;font-weight:700;}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-400);}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;
  padding:10px 16px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,transform .1s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-accent{background:var(--blue-500);color:#fff;}
.btn-accent:hover{background:#255cc9;}
.btn-secondary{background:#fff;color:var(--gray-700);border-color:var(--gray-300);}
.btn-secondary:hover{background:var(--gray-50);}
.btn-ghost{background:transparent;color:var(--gray-600);}
.btn-ghost:hover{background:var(--gray-100);}
.btn-danger-outline{background:#fff;color:var(--red-600);border-color:var(--red-200,#F0C6C6);}
.btn-danger-outline:hover{background:var(--red-50);}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn-block{width:100%;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-success{background:var(--green-600);color:#fff;}
.btn-success:hover{background:var(--green-700);}
.btn-warning{background:var(--orange-600);color:#fff;}
.btn-warning:hover{background:#c96a1f;}

/* ============ CARDS ============ */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);}
.card-pad{padding:20px;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.stat-card{
  background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);
  padding:19px 20px;position:relative;overflow:hidden;
}
.stat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--navy-800));}
.stat-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg,var(--blue-50));color:var(--accent,var(--navy-800));}
.stat-trend{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:99px;display:flex;align-items:center;gap:3px;}
.stat-trend.up{background:var(--green-50);color:var(--green-700);}
.stat-trend.warn{background:var(--orange-50);color:var(--orange-600);}
.stat-value{font-family:var(--font-mono);font-weight:600;font-size:26px;color:var(--gray-900);letter-spacing:-0.02em;}
.stat-label{font-size:13px;color:var(--gray-500);margin-top:4px;font-weight:500;}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.badge-green{background:var(--green-50);color:var(--green-700);}
.badge-gray{background:var(--gray-100);color:var(--gray-600);}
.badge-red{background:var(--red-50);color:var(--red-700);}
.badge-orange{background:var(--orange-50);color:var(--orange-600);}
.badge-blue{background:var(--blue-50);color:var(--blue-500);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:currentColor;}

/* List rows (recent payments) */
.list-row{
  display:flex;align-items:center;gap:13px;padding:13px 6px;border-bottom:1px solid var(--gray-100);
  cursor:pointer;transition:background .15s;border-radius:var(--radius-sm);
}
.list-row:hover{background:var(--gray-25);}
.list-row:last-child{border-bottom:none;}
.member-photo{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;}
.list-row-name{font-size:14px;font-weight:600;color:var(--gray-900);}
.list-row-meta{font-size:12px;color:var(--gray-500);margin-top:1px;}
.list-row-right{text-align:right;margin-left:auto;flex-shrink:0;}
.list-row-amount{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--gray-900);}
.list-row-time{font-size:11.5px;color:var(--gray-400);margin-top:2px;}

/* Progress bar */
.progress-track{background:var(--gray-100);border-radius:99px;height:10px;overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-600),#20A56C);transition:width .4s ease;}

/* Two column dashboard layout */
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:20px;align-items:start;}

/* ============ FORM ELEMENTS ============ */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
.field .req{color:var(--red-600);}
.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field input[type=email],.field input[type=password],.field select,.field textarea{
  width:100%;border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;
  background:#fff;color:var(--gray-900);transition:border-color .15s, box-shadow .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-50);outline:none;}
.field input.error{border-color:var(--red-600);}
.field .helper{font-size:12px;color:var(--gray-400);margin-top:5px;}
.field .error-msg{font-size:12px;color:var(--red-600);margin-top:5px;display:flex;align-items:center;gap:4px;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.input-prefix-wrap{position:relative;}
.input-prefix{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-500);font-size:13.5px;font-weight:600;font-family:var(--font-mono);}
.input-prefix-wrap input{padding-left:38px !important;}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--gray-400);display:flex;padding:4px;}
.photo-upload{
  width:84px;height:84px;border-radius:50%;border:2px dashed var(--gray-300);
  display:flex;align-items:center;justify-content:center;color:var(--gray-400);background:var(--gray-25);
  flex-shrink:0;position:relative;overflow:hidden;
}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
  color:var(--gray-400);padding:0 14px 10px;border-bottom:1px solid var(--gray-200);white-space:nowrap;
}
tbody td{padding:13px 14px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.clickable:hover{background:var(--gray-25);cursor:pointer;}
.td-member{display:flex;align-items:center;gap:10px;}
.td-name{font-weight:600;color:var(--gray-900);}
.td-sub{font-size:11.5px;color:var(--gray-400);}

/* ============ TOOLBAR ============ */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.search-box{position:relative;flex:1;min-width:220px;max-width:340px;}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--gray-400);}
.search-box input{width:100%;border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:9px 12px 9px 36px;font-size:13.5px;background:#fff;}
.search-box input:focus{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-50);outline:none;}
.select-box select{border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:9px 30px 9px 12px;font-size:13px;background:#fff;color:var(--gray-700);font-weight:500;}
.view-toggle{display:flex;border:1px solid var(--gray-300);border-radius:var(--radius-sm);overflow:hidden;}
.view-toggle button{padding:8px 11px;background:#fff;border:none;color:var(--gray-500);display:flex;}
.view-toggle button.active{background:var(--navy-900);color:#fff;}
.view-toggle button:not(:last-child){border-right:1px solid var(--gray-300);}

/* ============ MEMBER CARDS GRID ============ */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px;}
.member-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:box-shadow .15s,border-color .15s;}
.member-card:hover{box-shadow:var(--shadow-md);border-color:var(--gray-300);}
.member-card-top{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
.member-card-name{font-weight:700;font-size:14.5px;color:var(--gray-900);}
.member-card-id{font-size:11.5px;color:var(--gray-400);font-family:var(--font-mono);}
.member-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--gray-100);}
.mc-stat-label{font-size:10.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;}
.mc-stat-value{font-family:var(--font-mono);font-weight:600;font-size:14px;color:var(--gray-900);margin-top:2px;}

/* ============ PROFILE PAGE ============ */
.profile-header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px;}
.profile-header-info{flex:1;min-width:200px;}
.profile-header-actions{display:flex;gap:10px;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--gray-500);font-size:13px;font-weight:600;margin-bottom:14px;}
.back-link:hover{color:var(--gray-800);}
.summary-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0;}
.summary-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:16px 18px;}
.summary-card .eyebrow{margin-bottom:8px;}
.summary-card .val{font-family:var(--font-mono);font-weight:700;font-size:21px;color:var(--gray-900);}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 28px;}
.info-item-label{font-size:11.5px;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:4px;}
.info-item-value{font-size:14px;color:var(--gray-900);font-weight:500;}
.profile-cols{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:start;margin-top:20px;}
.calendar-full-section{width:100%;margin-top:20px;}
.member-profile-section{width:100%;margin-top:20px;scroll-margin-top:90px;}
.member-profile-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.member-info-grid{grid-template-columns:repeat(3,1fr);gap:22px 30px;}

/* ============ CALENDAR ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.cal-nav-btn{width:32px;height:32px;border-radius:var(--radius-sm);border:1px solid var(--gray-200);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--gray-600);}
.cal-nav-btn:hover{background:var(--gray-50);}
.cal-month-label{font-family:var(--font-display);font-weight:700;font-size:15px;}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:6px;
  width:100%;
  min-width:0;
  align-items:stretch;
}
.cal-dow{
  min-width:0;
  text-align:center;
  font-size:10.5px;
  font-weight:700;
  color:var(--gray-400);
  text-transform:uppercase;
  letter-spacing:0.03em;
  padding:0 2px 4px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.cal-cell{
  width:100%;
  min-width:0;
  aspect-ratio:1 / 1;
  border-radius:10px;
  border:1px solid var(--gray-200);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  background:var(--gray-25);
  cursor:pointer;
  transition:box-shadow .15s,border-color .15s;
  position:relative;
  padding:4px 2px;
  overflow:hidden;
}
.cal-cell:hover{box-shadow:var(--shadow-sm);}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell.future{background:var(--gray-25);color:var(--gray-300);cursor:pointer;opacity:0.8;}
.cal-cell.future:hover{opacity:1;}
.cal-cell.paid{background:var(--green-50);border-color:#CFEBDD;}
.cal-cell.missed{background:var(--red-50);border-color:#F5D3D3;}
.cal-cell.skipped{background:var(--gray-100);border-color:var(--gray-300);}
.cal-cell.notpaid{background:#fff;border-color:var(--gray-200);}
.cal-cell.today{outline:2px solid var(--blue-500);outline-offset:1px;}
.cal-cell.selectable-mode{cursor:pointer;}
.cal-cell.selected{outline:2.5px solid var(--blue-500);outline-offset:1px;box-shadow:0 0 0 3px var(--blue-50) inset;}
.cal-select-check{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:5px;border:1.6px solid var(--gray-300);background:#fff;display:flex;align-items:center;justify-content:center;color:transparent;z-index:2;}
.cal-cell.selected .cal-select-check{background:var(--blue-500);border-color:var(--blue-500);color:#fff;}
.cal-daynum{
  font-size:11px;
  font-weight:700;
  color:var(--gray-500);
  position:absolute;
  top:5px;
  left:7px;
  line-height:1;
  z-index:1;
}
.cal-cell.paid .cal-daynum{color:var(--green-700);}
.cal-cell.missed .cal-daynum{color:var(--red-700);}
.cal-cell.skipped .cal-daynum{color:var(--gray-500);}
.cal-status-icon{margin-top:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cal-status-text{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;margin-top:1px;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.cal-amount{font-family:var(--font-mono);font-size:10.5px;font-weight:700;margin-top:1px;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
.cal-cell.paid .cal-status-text,.cal-cell.paid .cal-amount{color:var(--green-700);}
.cal-cell.missed .cal-status-text{color:var(--red-700);}
.cal-cell.skipped .cal-status-text{color:var(--gray-500);}
.cal-cell.notpaid .cal-status-text{color:var(--gray-400);}
.cal-legend{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;}
.cal-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gray-500);font-weight:500;}
.cal-legend-dot{width:9px;height:9px;border-radius:3px;}
.cal-hint{font-size:12px;color:var(--gray-400);margin-top:10px;display:flex;align-items:center;gap:6px;}

/* Bulk select bar */
.bulk-bar{
  position:sticky;bottom:0;left:0;right:0;margin-top:16px;
  background:var(--navy-950);color:#fff;border-radius:var(--radius);
  padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  box-shadow:var(--shadow-lg);z-index:10;
}
.bulk-bar .bulk-count{font-size:13px;font-weight:700;margin-right:auto;}
.bulk-bar .btn{padding:8px 12px;font-size:12.5px;}

/* History filter row */
.hist-filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.chip{padding:6px 13px;border-radius:99px;border:1px solid var(--gray-300);background:#fff;font-size:12.5px;font-weight:600;color:var(--gray-600);}
.chip.active{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--gray-100);flex-wrap:wrap;gap:8px;}
.pagination .btn{padding:7px 13px;}
.page-info{font-size:12.5px;color:var(--gray-500);}

/* ============ MODAL ============ */
.modal-overlay{position:fixed;inset:0;background:rgba(8,21,39,0.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:#fff;border-radius:var(--radius-lg);width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:20px 22px 4px;display:flex;align-items:flex-start;justify-content:space-between;}
.modal-head h3{font-size:17px;}
.modal-close{background:var(--gray-100);border:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gray-500);flex-shrink:0;}
.modal-close:hover{background:var(--gray-200);}
.modal-body{padding:16px 22px 6px;}
.modal-footer{padding:16px 22px 22px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
.readonly-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13.5px;gap:10px;}
.readonly-row .rk{color:var(--gray-500);}
.readonly-row .rv{font-weight:600;color:var(--gray-900);text-align:right;}

/* Action buttons in modal */
.action-buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0;}
.action-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:var(--radius-sm);border:2px solid var(--gray-200);background:#fff;font-weight:600;font-size:12px;transition:all .15s;}
.action-btn:hover{border-color:var(--gray-400);transform:translateY(-1px);}
.action-btn.active-paid{border-color:var(--green-600);background:var(--green-50);color:var(--green-700);}
.action-btn.active-skipped{border-color:var(--gray-500);background:var(--gray-100);color:var(--gray-700);}
.action-btn.active-missed{border-color:var(--red-600);background:var(--red-50);color:var(--red-700);}
.action-btn svg{display:block;}

/* Confirm dialog */
.confirm-icon-wrap{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}

/* Savings account section (dashboard) */
.savings-account-card{
  background:linear-gradient(135deg,var(--navy-950) 0%,var(--navy-800) 100%);
  border-radius:var(--radius-lg);padding:22px 24px;color:#fff;position:relative;overflow:hidden;margin-top:20px;
}
.savings-account-card::before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(126,176,255,0.10);}
.savings-account-card::after{content:"";position:absolute;left:-30px;bottom:-50px;width:140px;height:140px;border-radius:50%;background:rgba(23,138,90,0.10);}
.sa-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;flex-wrap:wrap;}
.sa-eyebrow{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#8FA8D6;display:flex;align-items:center;gap:7px;}
.sa-balance{font-family:var(--font-mono);font-weight:700;font-size:34px;letter-spacing:-0.02em;margin-top:8px;position:relative;z-index:1;}
.sa-breakdown{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1;}
.sa-break-item{display:flex;align-items:center;gap:8px;}
.sa-break-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);}
.sa-break-label{font-size:11px;color:#8FA8D6;font-weight:600;}
.sa-break-val{font-family:var(--font-mono);font-weight:700;font-size:14.5px;}

/* ============ TOASTS ============ */
#toast-stack{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 32px);}
.toast{
  background:var(--gray-900);color:#fff;padding:13px 18px;border-radius:var(--radius);
  display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);
  min-width:260px;animation:toastIn .25s ease;
}
.toast.success{background:var(--green-700);}
.toast.error{background:var(--red-700);}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ============ EMPTY STATE ============ */
.empty-state{text-align:center;padding:54px 20px;}
.empty-state svg{color:var(--gray-300);margin-bottom:14px;}
.empty-state h4{font-size:15px;margin-bottom:5px;}
.empty-state p{font-size:13.5px;color:var(--gray-500);margin-bottom:16px;}

/* ============ SKELETON ============ */
.skel{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 37%,var(--gray-100) 63%);background-size:400% 100%;animation:skel 1.4s ease infinite;border-radius:8px;}
@keyframes skel{0%{background-position:100% 50%;}100%{background-position:0 50%;}}

/* ============ REPORTS / CHARTS ============ */
.report-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.chart-card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:20px;}
.bar-chart-wrap{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;}
.bar-rect{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:var(--navy-800);transition:height .5s ease;position:relative;}
.bar-rect:hover{background:var(--blue-500);}
.bar-label{font-size:10.5px;color:var(--gray-500);font-weight:600;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
.leaderboard-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--gray-100);}
.leaderboard-row:last-child{border-bottom:none;}
.lb-rank{width:22px;height:22px;border-radius:6px;background:var(--gray-100);color:var(--gray-600);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ============ LOGIN PAGE ============ */
#login-view{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
.login-left{
  background:var(--navy-950);
  background-image:radial-gradient(circle at 20% 20%, rgba(46,111,237,0.18), transparent 45%), radial-gradient(circle at 80% 75%, rgba(23,138,90,0.14), transparent 40%);
  color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;
}
.login-left-quote{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.4;max-width:440px;letter-spacing:-0.01em;}
.login-left-quote span{color:#7EB0FF;}
.growth-chart{margin-top:40px;}
.login-left-foot{font-size:12.5px;color:#6E82A8;}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff;}
.login-form-wrap{width:100%;max-width:380px;}
.login-form-wrap h1{font-size:26px;margin-bottom:6px;}
.login-form-wrap .sub{color:var(--gray-500);font-size:14px;margin-bottom:30px;}
.remember-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-600);font-weight:500;}
.checkbox-row input{width:15px;height:15px;accent-color:var(--navy-900);}
.forgot-link{font-size:13px;color:var(--blue-500);font-weight:600;}
.login-security-note{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:26px;font-size:12px;color:var(--gray-400);}

/* ============ RESPONSIVE ============ */

}

}

  .stat-card{padding:14px;}
  .stat-value{font-size:18px;}
  .stat-label{font-size:11.5px;}
  .stat-icon{width:32px;height:32px;}

  .member-card{padding:12px;}

  .member-info-grid{grid-template-columns:1fr;}
  .member-profile-section-head{align-items:stretch;}
  .member-profile-section-head .btn{width:100%;}
  .field-row{grid-template-columns:1fr;}
  .summary-cards{grid-template-columns:1fr 1fr;gap:8px;}

  table thead{display:none;}

  .members-grid{grid-template-columns:1fr;}
  .stats-grid{grid-template-columns:1fr;}
  .summary-cards{grid-template-columns:1fr 1fr;}
}

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(20260810);
function rand(a,b){return a+rng()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[randInt(0,arr.length-1)];}

  wallet:'<rect x="3" y="6.5" width="18" height="13" rx="2.2"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.3"/>',

  calCheck:'<rect x="3" y="4.5" width="18" height="16" rx="2.2"/><path d="M3 9.5h18"/><path d="M7 2.5v4M17 2.5v4"/><path d="m8.7 14.5 2 2 4.2-4.3"/>',
  bell:'<path d="M6 9a6 6 0 1 1 12 0c0 4.2 1.3 5.7 2 6.5H4c.7-.8 2-2.3 2-6.5Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/>',
  search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.7-4.7"/>',
  filter:'<path d="M3 5h18M6.5 12h11M10.5 19h3"/>',

const AV_COLORS = ['#28548F','#178A5A','#DB7A2C','#6C5FC4','#C24E6E','#1C8FA8','#8A6D1C','#4E5768'];
function initialsOf(name){const p=name.trim().split(/\s+/);return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();}
function colorFor(name){let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);return AV_COLORS[Math.abs(h)%AV_COLORS.length];}
function avatar(name,size=42,radiusClass='avatar'){

}

/* ---------- formatters ---------- */
function GHS(n){return 'GH₵ ' + n.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});}
function GHSshort(n){return 'GH₵' + n.toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function fmtDateLong(d){return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
function fmtDateFull(d){const dow=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];return `${dow[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;}
function isoDate(d){return d.toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return isoDate(a)===isoDate(b);}
let __idCounter=1;
function genId(){return 'tx'+(__idCounter++)+'_'+Math.floor(rng()*100000);}

const FIRST_NAMES=['Kwame','Ama','Kofi','Akosua','Yaw','Efua','Kwabena','Adjoa','Kwaku','Abena','Kojo','Afia','Yaw','Esi','Nana','Adwoa','Fiifi','Akua','Kwesi','Araba','Ebo','Baaba','Kwadwo','Sena','Elikem','Selorm','Mawusi','Nafisa','Ibrahim','Fatima','Yussif','Zainab','Emmanuel','Comfort','Prince','Gifty','Solomon','Rita','Isaac','Linda'];
const LAST_NAMES=['Mensah','Boateng','Owusu','Asante','Agyeman','Appiah','Osei','Darko','Amoah','Adjei','Frimpong','Antwi','Nkrumah','Gyasi','Ofori','Yeboah','Sarpong','Danquah','Tetteh','Quaye','Addo','Ankrah','Bediako','Kusi'];
const AREAS=['Adabraka, Accra','Osu, Accra','Madina, Accra','Kaneshie, Accra','Tema Community 5','Ashaiman','Dansoman, Accra','Nungua, Accra','East Legon, Accra','Achimota, Accra','Abeka, Accra','Teshie, Accra','Lapaz, Accra','Ablekuma, Accra','Sowutuom, Accra'];

function genPhone(){return '024'+String(randInt(1000000,9999999));}

function buildMember(idx){
  const first=pick(FIRST_NAMES), last=pick(LAST_NAMES);
  const name=`${first} ${last}`;
  const cardNumber=String(idx);
  const daily=pick([10,15,20,25,30,50]);
  const joinDaysAgo=randInt(20,210);
  const dateJoined=addDays(TODAY,-joinDaysAgo);
  // build daily statuses since join
  const payments={}; // iso -> {amount, time, recordedBy, note, status: 'paid'|'missed'|'skipped'}
  let totalSavings=0, daysPaid=0, daysMissed=0, daysSkipped=0;

  // decide if this member is a "flagged" 5-day-missed case
  const forceStreak = idx===1?5: idx===4?5: idx===11?7 : 0;

  for(let i=joinDaysAgo;i>=0;i--){
    const day=addDays(TODAY,-i);
    const iso=isoDate(day);
    let paid;
    if(forceStreak>0 && i< forceStreak){
      paid=false;
    } else {
      paid = rng() < 0.86;
    }
    if(paid){
      daysPaid++; totalSavings+=daily;
      const hh=String(randInt(7,17)).padStart(2,'0'), mm=String(randInt(0,59)).padStart(2,'0');
      payments[iso]={amount:daily,time:`${(hh%12)||12}:${mm} ${hh>=12?'PM':'AM'}`,recordedBy:'Admin',note:'',status:'paid'};
    } else {
      daysMissed++;
    }
  }
  // find last payment date + current streak of misses
  let lastPaymentDate=null, missStreak=0;
  for(let i=0;i<=joinDaysAgo;i++){
    const day=addDays(TODAY,-i); const iso=isoDate(day);
    if(payments[iso] && payments[iso].status==='paid'){ if(!lastPaymentDate) lastPaymentDate=day; break; }
    missStreak++;
  }
  const paidToday = !!(payments[isoDate(TODAY)] && payments[isoDate(TODAY)].status==='paid');

  return {
    id:idx, name, cardNumber, phone:genPhone(), address:pick(AREAS),
    dateJoined, dailySavings:daily,
    totalSavings /* net balance */, totalDeposited:totalSavings, totalWithdrawn:0,
    daysPaid, daysMissed, daysSkipped:0,
    payments, withdrawals:{}, paidToday, lastPaymentDate, missStreak, status:'Active'
  };
}

const MEMBERS = Array.from({length:34},(_,i)=>buildMember(i+1));

/* ---------- derived collections ---------- */
function todaysPaidMembers(){
  return MEMBERS.filter(m=>m.payments[isoDate(TODAY)] && m.payments[isoDate(TODAY)].status==='paid')
    .map(m=>({m, pay:m.payments[isoDate(TODAY)]}))
    .sort((a,b)=> (b.pay.time > a.pay.time?1:-1));
}
function recentPayments(n){
  const all=[];
  MEMBERS.forEach(m=>{
    Object.keys(m.payments).forEach(iso=>{
      if(m.payments[iso].status==='paid'){
        all.push({m,iso,pay:m.payments[iso]});
      }
    });
  });
  all.sort((a,b)=> a.iso===b.iso ? 0 : (a.iso<b.iso?1:-1));
  return all.slice(0,n);
}
function flaggedMembers(){
  return MEMBERS.filter(m=>m.missStreak>=5).sort((a,b)=>b.missStreak-a.missStreak);
}
function totalSavingsAll(){return MEMBERS.reduce((s,m)=>s+m.totalSavings,0);}
function totalDepositedAll(){return MEMBERS.reduce((s,m)=>s+m.totalDeposited,0);}
function totalWithdrawnAll(){return MEMBERS.reduce((s,m)=>s+m.totalWithdrawn,0);}
function collectedToday(){return todaysPaidMembers().reduce((s,x)=>s+x.pay.amount,0);}
function greeting(){const h=NOW.getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

function filteredMembers(){

  const q=state.memberSearch.trim().toLowerCase();
  if(q) list=list.filter(m=>m.name.toLowerCase().includes(q)||m.cardNumber.toLowerCase().includes(q));
  if(state.memberSort==='name') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(state.memberSort==='savings') list.sort((a,b)=>b.totalSavings-a.totalSavings);
  if(state.memberSort==='recent') list.sort((a,b)=>b.dateJoined-a.dateJoined);
  if(state.memberSort==='missed') list.sort((a,b)=>b.missStreak-a.missStreak);
  return list;
}

function renderCalendarCard(m){
  const y=state.profileCalYear, mo=state.profileCalMonth;
  const firstOfMonth=new Date(y,mo,1);
  let startOffset=(firstOfMonth.getDay()+6)%7;
  const daysInMonth=new Date(y,mo+1,0).getDate();
  const cells=[];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(new Date(y,mo,d));

  const monthLabel=`${MONTHS[mo]} ${y}`;
  let cellsHtml='';
  cells.forEach(day=>{
    if(!day){cellsHtml+=`<div class="cal-cell empty"></div>`;return;}
    const iso=isoDate(day);
    const isFuture = day > TODAY;
    const isToday = sameDay(day,TODAY);
    const pay=m.payments[iso];
    const status = pay ? pay.status : null;
    const beforeJoin = day < m.dateJoined;
    let cls='cal-cell', body='';

    // An explicit payment record always wins, regardless of whether the
    // date happens to be in the future, today, or the past — otherwise a
    // pre-recorded future payment (which the modal explicitly allows) gets
    // masked by the "future" default and never shows as paid/skipped/missed.
    if(status === 'paid'){
      cls+=' paid';
      body=`<div class="cal-daynum">${day.getDate()}</div><div class="cal-status-icon">${icon('checkCircle',14)}</div><div class="cal-status-text">Paid</div><div class="cal-amount">${GHSshort(pay.amount)}</div>`;
    } else if(status === 'skipped'){
      cls+=' skipped';
      body=`<div class="cal-daynum">${day.getDate()}</div><div class="cal-status-icon">${icon('minus',14)}</div><div class="cal-status-text">Skipped</div>`;
    } else if(status === 'missed'){
      cls+=' missed';
      body=`<div class="cal-daynum">${day.getDate()}</div><div class="cal-status-icon">${icon('xCircle',14)}</div><div class="cal-status-text">Missed</div>`;
    } else if(isFuture){
      cls+=' future';
      body=`<div class="cal-daynum">${day.getDate()}</div>`;
    } else if(beforeJoin){
      cls+=' future';
      body=`<div class="cal-daynum">${day.getDate()}</div>`;
    } else {
      cls += (day < TODAY) ? ' missed' : ' notpaid';
      const statusText = (day < TODAY) ? 'Missed' : 'Not Paid';
      const statusIcon = (day < TODAY) ? 'xCircle' : 'clock';
      body=`<div class="cal-daynum">${day.getDate()}</div><div class="cal-status-icon">${icon(statusIcon,14)}</div><div class="cal-status-text">${statusText}</div>`;
    }
    if(isToday) cls+=' today';
    if(state.calSelecting && !beforeJoin){
      cls+=' selectable-mode';
      if(state.calSelectedDates.has(iso)) cls+=' selected';
      body+=`<div class="cal-select-check">${icon('checkCircle',11,2.4)}</div>`;
    }
    cellsHtml+=`<div class="${cls}" data-cal-date="${iso}" data-member="${m.id}" ${beforeJoin?'data-before-join="1"':''}>${body}</div>`;
  });

  const selCount=state.calSelectedDates.size;

  return `
    <div class="cal-head">
      <h3 class="section-title">Savings Calendar</h3>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="btn ${state.calSelecting?'btn-primary':'btn-secondary'} btn-sm" id="cal-select-toggle">${icon('checkSquare',14)} ${state.calSelecting?'Cancel Selecting':'Select Multiple'}</button>
        <button class="cal-nav-btn" id="cal-prev">${icon('chevLeft',16)}</button>
        <span class="cal-month-label">${monthLabel}</span>
        <button class="cal-nav-btn" id="cal-next">${icon('chevRight',16)}</button>
      </div>
    </div>
    <div class="cal-grid" style="margin-bottom:4px;">
      ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cellsHtml}
    </div>
    <div class="cal-legend">
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--green-600);"></span>Paid</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--red-600);"></span>Missed</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--gray-400);"></span>Skipped</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--gray-300);"></span>Not Yet Due</div>
      <div class="cal-legend-item"><span class="cal-legend-dot" style="background:var(--blue-500);"></span>Today</div>
    </div>
    ${state.calSelecting? `
    <div class="bulk-bar">
      <div class="bulk-count">${selCount} day${selCount===1?'':'s'} selected</div>
      <div class="bulk-actions">
        <button class="btn btn-success" id="bulk-mark-paid" ${selCount===0?'disabled':''}>${icon('checkCircle',14)} Mark Paid</button>
        <button class="btn btn-secondary" id="bulk-mark-skipped" ${selCount===0?'disabled':''}>${icon('minus',14)} Skip</button>
        <button class="btn btn-danger-outline" id="bulk-mark-missed" ${selCount===0?'disabled':''}>${icon('xCircle',14)} Missed</button>
      </div>
    </div>` : `
    <div class="cal-hint">${icon('info',13)} Tap a date to record that day's payment, or use "Select Multiple" to mark several days at once.</div>
    `}
  `;
}

function historyEntries(m){
  const dEntries=Object.keys(m.payments).map(iso=>({iso,type:'deposit',amount:m.payments[iso].amount,note:m.payments[iso].note,recordedBy:m.payments[iso].recordedBy,status:m.payments[iso].status}));
  const wEntries=Object.keys(m.withdrawals).map(key=>{const w=m.withdrawals[key];return {iso:w.iso,type:'withdrawal',amount:w.amount,note:w.note,recordedBy:w.recordedBy,status:'withdrawn'};});
  let entries=dEntries.concat(wEntries);
  entries.sort((a,b)=> a.iso<b.iso?1:a.iso>b.iso?-1:0);
  if(state.historyFilter==='month') entries=entries.filter(e=>e.iso.slice(0,7)===isoDate(TODAY).slice(0,7));
  if(state.historyFilter==='week') entries=entries.filter(e=> new Date(e.iso) >= addDays(TODAY,-7));
  return entries;
}

          <td data-label="Recorded By">${e.recordedBy||'Admin'}</td>
        </tr>`;}).join('')}
      </tbody>
    </table></div>
    <div class="pagination">
      <button class="btn btn-secondary" id="hist-prev" ${page<=1?'disabled':''}>${icon('chevLeft',14)} Previous</button>
      <span class="page-info">Page ${page} of ${totalPages}</span>
      <button class="btn btn-secondary" id="hist-next" ${page>=totalPages?'disabled':''}>Next ${icon('chevRight',14)}</button>
    </div>`}
  `;
}

function weeklySeries(){
  const days=[]; let vals=[];
  for(let i=6;i>=0;i--){
    const d=addDays(TODAY,-i);
    const iso=isoDate(d);
    let sum=0; MEMBERS.forEach(m=>{if(m.payments[iso] && m.payments[iso].status==='paid')sum+=m.payments[iso].amount;});
    days.push(DOW[(d.getDay()+6)%7]); vals.push(sum);
  }
  return {days,vals};
}
function monthlySeries(){
  const labels=[],vals=[];
  for(let i=5;i>=0;i--){
    const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);
    const ym=isoDate(d).slice(0,7);
    let sum=0; MEMBERS.forEach(m=>Object.keys(m.payments).forEach(iso=>{if(iso.slice(0,7)===ym && m.payments[iso].status==='paid') sum+=m.payments[iso].amount;}));
    labels.push(MONTHS[d.getMonth()].slice(0,3)); vals.push(sum);
  }
  return {labels,vals};
}
function barChart(labels,vals,fmt){
  const max=Math.max(...vals,1);
  return `<div class="bar-chart-wrap">
    ${labels.map((l,i)=>`
      <div class="bar-col">
        <div style="font-size:10px;color:var(--gray-500);font-weight:600;" class="num">${fmt(vals[i])}</div>
        <div class="bar-rect" style="height:${Math.max(6,(vals[i]/max)*140)}px;" title="${fmt(vals[i])}"></div>
        <div class="bar-label">${l}</div>
      </div>`).join('')}
  </div>`;
}

function openModal(html){

  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal-overlay').classList.add('hidden');}

function openPaymentModal(memberId,dateIso){
  const m=getMember(memberId);
  const date=dateIso?new Date(dateIso):TODAY;
  const iso=isoDate(date);
  const existing = m.payments[iso];
  const status = existing ? existing.status : null;
  const isFuture = date > TODAY;

  // Check if date is before member joined
  const beforeJoin = date < m.dateJoined;

  let statusMessage = '';
  if(beforeJoin) {
    statusMessage = `<div class="readonly-row" style="background:var(--gray-50);padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:12px;color:var(--gray-500);">
      <span>⚠️ This date is before the member joined (${fmtDateLong(m.dateJoined)}).</span>
    </div>`;
  } else if(isFuture) {
    statusMessage = `<div class="readonly-row" style="background:var(--blue-50);padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:12px;color:var(--blue-500);">
      <span>📅 This is a future date. You can pre-record or skip this day.</span>
    </div>`;
  }

  openModal(`
    <div class="modal-head"><h3>Record Savings Payment</h3><button class="modal-close" id="modal-close-btn">${icon('x',15)}</button></div>
    <div class="modal-body">
      <div class="readonly-row"><span class="rk">Member</span><span class="rv">${m.name}</span></div>
      <div class="readonly-row"><span class="rk">Date</span><span class="rv">${fmtDateLong(date)}</span></div>
      ${statusMessage}
      <div class="readonly-row"><span class="rk">Current Status</span><span class="rv"><span class="badge ${status==='paid'?'badge-green':status==='skipped'?'badge-gray':status==='missed'?'badge-red':'badge-gray'}">${status ? status.charAt(0).toUpperCase()+status.slice(1) : 'Not recorded'}</span></span></div>

      <div style="margin:16px 0;">
        <label style="font-size:13px;font-weight:600;color:var(--gray-700);display:block;margin-bottom:10px;">Select action for this date:</label>
        <div class="action-buttons">
          <button class="action-btn ${status==='paid'?'active-paid':''}" data-action="paid">
            ${icon('checkCircle',22)}
            <span>Mark Paid</span>
            <span style="font-size:10px;color:var(--gray-400);">${GHSshort(m.dailySavings)}</span>
          </button>
          <button class="action-btn ${status==='skipped'?'active-skipped':''}" data-action="skipped">
            ${icon('minus',22)}
            <span>Skip Day</span>
            <span style="font-size:10px;color:var(--gray-400);">No charge</span>
          </button>
          <button class="action-btn ${status==='missed'?'active-missed':''}" data-action="missed">
            ${icon('xCircle',22)}
            <span>Mark Missed</span>
            <span style="font-size:10px;color:var(--gray-400);">No charge</span>
          </button>
        </div>
      </div>

      <div class="field" id="amount-field" style="${status==='paid'?'':'display:none;'}">
        <label>Amount Paid</label>
        <div class="input-prefix-wrap"><span class="input-prefix">GH₵</span><input type="number" id="pay-amount" value="${existing && existing.status==='paid'?existing.amount:m.dailySavings}" step="0.5"/></div>
      </div>
      <div class="field">
        <label>Note <span style="color:var(--gray-400);font-weight:500;">(optional)</span></label>
        <textarea id="pay-note" rows="2" placeholder="Payment note...">${existing?existing.note||'':''}</textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modal-cancel-btn">Cancel</button>
      <button class="btn btn-accent" id="confirm-payment-btn" data-member="${m.id}" data-date="${iso}">${icon('checkCircle',15)} Save</button>
    </div>
  `);

  // Add action button listeners
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const action = this.dataset.action;
      // Update active state
      document.querySelectorAll('.action-btn').forEach(b => {
        b.className = 'action-btn';
      });
      this.classList.add(`active-${action}`);

      // Show/hide amount field for paid
      const amountField = document.getElementById('amount-field');
      if(action === 'paid') {
        amountField.style.display = 'block';
      } else {
        amountField.style.display = 'none';
      }

      // Store selected action
      this.closest('.modal-body').dataset.selectedAction = action;
    });
  });

  // Set default active if status exists
  if(status) {
    const actionBtn = document.querySelector(`.action-btn[data-action="${status}"]`);
    if(actionBtn) actionBtn.click();
  } else {
    // Default to paid if no status
    const paidBtn = document.querySelector('.action-btn[data-action="paid"]');
    if(paidBtn) paidBtn.click();
  }
}
function confirmPayment(memberId, iso) {
  const m = getMember(memberId);
  const modalBody = document.querySelector('.modal-body');
  const action = modalBody ? modalBody.dataset.selectedAction || 'paid' : 'paid';
  const amount = action === 'paid' ? parseFloat(document.getElementById('pay-amount').value) || m.dailySavings : 0;
  const note = document.getElementById('pay-note').value;

  // Update payment record
  if (action === 'paid') {
    m.payments[iso] = {
      amount: amount,
      time: sameDay(new Date(iso), TODAY) ? nowTimeStr() : '9:00 AM',
      recordedBy: 'Admin',
      note: note,
      status: 'paid'
    };
  } else {
    m.payments[iso] = {
      amount: 0,
      time: sameDay(new Date(iso), TODAY) ? nowTimeStr() : '9:00 AM',
      recordedBy: 'Admin',
      note: note,
      status: action // 'skipped' or 'missed'
    };
  }

  // Recalculate member stats (totalSavings, daysPaid, daysMissed, missStreak, lastPaymentDate)
  // directly from m.payments, so the derived numbers always match what's stored.
  recomputeMemberDerived(m);
  closeModal();

  const actionMsg = action === 'paid' ? 'payment recorded' : `day marked as ${action}`;
  toast('success', 'checkCircle', `${actionMsg} successfully.`);

  // Re-render the whole profile page so the calendar cell, summary cards,
  // status badges, and history table all reflect the new data immediately.
  const currentMemberId = state.selectedMemberId;
  go('member-profile', { selectedMemberId: currentMemberId });
}

/* ---------- Bulk (multi-day) marking ---------- */
function applyBulkAction(memberId, action){
  const m=getMember(memberId);
  const dates=Array.from(state.calSelectedDates);
  if(dates.length===0) return;
  dates.forEach(iso=>{
    if(action==='paid'){
      m.payments[iso]={
        amount:m.dailySavings,
        time: sameDay(new Date(iso),TODAY)?nowTimeStr():'9:00 AM',
        recordedBy:'Admin', note:'Bulk update', status:'paid'
      };
    } else {
      m.payments[iso]={
        amount:0,
        time: sameDay(new Date(iso),TODAY)?nowTimeStr():'9:00 AM',
        recordedBy:'Admin', note:'Bulk update', status:action
      };
    }
  });
  recomputeMemberDerived(m);
  const count=dates.length;
  state.calSelecting=false;
  state.calSelectedDates=new Set();
  toast('success','checkCircle',`${count} day${count===1?'':'s'} marked as ${action}.`);
  go('member-profile',{selectedMemberId:memberId});
}

function confirmWithdraw(memberId){
  const m=getMember(memberId);
  const amtInput=document.getElementById('withdraw-amount');
  const amount=parseFloat(amtInput.value);
  const errEl=document.getElementById('err-withdraw');
  if(!amount || amount<=0 || amount>m.totalSavings){
    errEl.classList.remove('hidden');
    amtInput.classList.add('error');
    return;
  }
  errEl.classList.add('hidden');
  const note=document.getElementById('withdraw-note').value;
  const id=genId();
  m.withdrawals[id]={
    iso: isoDate(TODAY),
    amount: amount,
    note: note,
    recordedBy:'Admin',
    time: nowTimeStr()
  };
  recomputeMemberDerived(m);
  closeModal();
  toast('success','minusCircle',`${GHSshort(amount)} withdrawn from ${m.name}'s savings.`);
  go('member-profile',{selectedMemberId:memberId});
}

function nowTimeStr(){const h=NOW.getHours(),mi='0'+NOW.getMinutes();return `${(h%12)||12}:${mi.slice(-2)} ${h>=12?'PM':'AM'}`;}

function recomputeMemberDerived(m){
  const joinDaysAgo=Math.round((TODAY-m.dateJoined)/86400000);

  // Tally deposit totals purely from the stored payment records.
  let totalDeposited=0, daysPaid=0, daysMissed=0;
  for(let i=0;i<=joinDaysAgo;i++){
    const iso=isoDate(addDays(TODAY,-i));
    const pay=m.payments[iso];
    if(pay && pay.status==='paid'){
      totalDeposited+=pay.amount;
      daysPaid++;
    } else if(pay && pay.status==='skipped'){
      // skipped days aren't counted as paid or missed
    } else {
      // explicit 'missed' record, or no record at all for a past day
      daysMissed++;
    }
  }

  // Tally withdrawals.
  let totalWithdrawn=0;
  Object.keys(m.withdrawals).forEach(k=>{totalWithdrawn+=m.withdrawals[k].amount;});

  // Current consecutive-miss streak: walk back from today until the most
  // recent 'paid' day is found.
  let lastPaymentDate=null, missStreak=0;
  for(let i=0;i<=joinDaysAgo;i++){
    const day=addDays(TODAY,-i);
    const iso=isoDate(day);
    const pay=m.payments[iso];
    if(pay && pay.status==='paid'){ lastPaymentDate=day; break; }
    missStreak++;
  }

  m.totalDeposited=totalDeposited;
  m.totalWithdrawn=totalWithdrawn;
  m.totalSavings=totalDeposited-totalWithdrawn;
  m.daysPaid=daysPaid;
  m.daysMissed=daysMissed;
  m.lastPaymentDate=lastPaymentDate;
  m.missStreak=missStreak;
  m.paidToday=!!(m.payments[isoDate(TODAY)] && m.payments[isoDate(TODAY)].status==='paid');
}

function toast(type,iconName,msg){
  const stack=document.getElementById('toast-stack');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=`${icon(iconName,17)}<span>${msg}</span>`;
  stack.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},3200);
}

function render(){
  renderChrome();
  const content=document.getElementById('content');
  let html='';
  switch(state.route){
    case 'dashboard': html=pageDashboard(); break;
    case 'members': html=pageMembers(); break;
    case 'add-member': html=pageAddMember(); break;
    case 'member-profile': html=pageMemberProfile(state.selectedMemberId); break;
    case 'today': html=pageToday(); break;

}

/* =========================================================================
   EVENT DELEGATION
   ========================================================================= */
document.addEventListener('click',function(e){
  // nav items (sidebar + inline data-nav buttons)
  const navBtn=e.target.closest('[data-nav]');
  if(navBtn){
    const target=navBtn.getAttribute('data-nav');
    if(target==='members'){ state.memberSearch=''; }
    go(target);
    closeSidebarMobile();
    return;
  }
  const gotoMember=e.target.closest('[data-goto-member]');
  if(gotoMember){
    const id=Number(gotoMember.getAttribute('data-goto-member'));
    state.profileCalMonth=TODAY.getMonth(); state.profileCalYear=TODAY.getFullYear();
    state.historyFilter='all'; state.historyPage=1;
    state.calSelecting=false; state.calSelectedDates=new Set();
    go('member-profile',{selectedMemberId:id});
    return;
  }
  if(e.target.closest('#notif-bell-btn')){
    document.getElementById('notif-dropdown').classList.toggle('hidden');
    return;
  }
  if(e.target.closest('#topbar-avatar-btn')){
    document.getElementById('notif-dropdown').classList.add('hidden');
    return;
  }
  if(!e.target.closest('.dropdown-panel') && !e.target.closest('#notif-bell-btn')){
    document.getElementById('notif-dropdown').classList.add('hidden');
  }
  if(e.target.closest('#hamburger-btn')){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-backdrop').classList.add('active');
    return;
  }
  if(e.target.closest('#sidebar-backdrop')){ closeSidebarMobile(); return; }
  if(e.target.closest('#logout-btn')){
    document.getElementById('app-shell').classList.remove('active');
    document.getElementById('login-view').style.display='grid';
    return;
  }

  // members view toggle
  const viewBtn=e.target.closest('[data-view]');
  if(viewBtn){ state.membersViewMode=viewBtn.getAttribute('data-view'); render(); return; }

  // calendar: toggle select-multiple mode
  if(e.target.closest('#cal-select-toggle')){
    state.calSelecting=!state.calSelecting;
    state.calSelectedDates=new Set();
    document.getElementById('calendar-card').innerHTML=renderCalendarCard(getMember(state.selectedMemberId));
    return;
  }

  // calendar nav
  if(e.target.closest('#cal-prev')){
    state.profileCalMonth--; if(state.profileCalMonth<0){state.profileCalMonth=11;state.profileCalYear--;}
    document.getElementById('calendar-card').innerHTML=renderCalendarCard(getMember(state.selectedMemberId)); return;
  }
  if(e.target.closest('#cal-next')){
    state.profileCalMonth++; if(state.profileCalMonth>11){state.profileCalMonth=0;state.profileCalYear++;}
    document.getElementById('calendar-card').innerHTML=renderCalendarCard(getMember(state.selectedMemberId)); return;
  }
  const calCell=e.target.closest('[data-cal-date]');
  if(calCell){
    if(calCell.hasAttribute('data-before-join')) return;
    const memberId=Number(calCell.getAttribute('data-member'));
    const iso=calCell.getAttribute('data-cal-date');
    if(state.calSelecting){
      if(state.calSelectedDates.has(iso)) state.calSelectedDates.delete(iso);
      else state.calSelectedDates.add(iso);
      document.getElementById('calendar-card').innerHTML=renderCalendarCard(getMember(memberId));
      return;
    }
    openPaymentModal(memberId,iso);
    return;
  }

  // bulk action buttons
  const bulkBtn=e.target.closest('#bulk-mark-paid,#bulk-mark-skipped,#bulk-mark-missed');
  if(bulkBtn){
    const action = bulkBtn.id==='bulk-mark-paid'?'paid': bulkBtn.id==='bulk-mark-skipped'?'skipped':'missed';
    applyBulkAction(state.selectedMemberId, action);
    return;
  }

  // withdraw funds
  const withdrawBtn=e.target.closest('#withdraw-btn');
  if(withdrawBtn){ openWithdrawModal(Number(withdrawBtn.getAttribute('data-member'))); return; }
  const confirmWithdrawBtn=e.target.closest('#confirm-withdraw-btn');
  if(confirmWithdrawBtn){ confirmWithdraw(Number(confirmWithdrawBtn.getAttribute('data-member'))); return; }

  // modal close/cancel
  if(e.target.closest('#modal-close-btn')||e.target.closest('#modal-cancel-btn')||e.target===document.getElementById('modal-overlay')){ closeModal(); return; }
  const confirmBtn=e.target.closest('#confirm-payment-btn');
  if(confirmBtn){ confirmPayment(Number(confirmBtn.getAttribute('data-member')),confirmBtn.getAttribute('data-date')); return; }

  // history filters
  const histChip=e.target.closest('[data-hist-filter]');
  if(histChip){ state.historyFilter=histChip.getAttribute('data-hist-filter'); state.historyPage=1; document.getElementById('history-card').innerHTML=renderHistoryCard(getMember(state.selectedMemberId)); return; }
  if(e.target.closest('#hist-prev')){ state.historyPage=Math.max(1,state.historyPage-1); document.getElementById('history-card').innerHTML=renderHistoryCard(getMember(state.selectedMemberId)); return; }
  if(e.target.closest('#hist-next')){ state.historyPage=state.historyPage+1; document.getElementById('history-card').innerHTML=renderHistoryCard(getMember(state.selectedMemberId)); return; }

  // report range chips
  const repChip=e.target.closest('[data-report-range]');
  if(repChip){ state.reportRange=repChip.getAttribute('data-report-range'); render(); return; }

  // member profile section navigation
  if(e.target.closest('#member-profile-jump')){
    const section=document.getElementById('member-profile-section');
    if(section) section.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(e.target.closest('#member-profile-top')){
    const calendar=document.getElementById('calendar-card');
    if(calendar) calendar.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }

  // edit member (placeholder toast)
  if(e.target.closest('#edit-member-btn')){ toast('success','info','Editing member details is available in the full release.'); return; }
});

function renderMembersListOnly(){
  const list=filteredMembers();
  const toolbarCount=document.querySelector('.toolbar > div[style*="margin-left"]');
  if(toolbarCount) toolbarCount.textContent=`${list.length} member${list.length===1?'':'s'}`;
  const container=document.querySelector('#content');
  const resultsHost=container.querySelector('.members-grid,.table-wrap,.empty-state');
  if(!resultsHost) return;
  const newHtml = list.length===0? emptyState('users','No members found','Try a different search term or add a new member.','add-member','Add Member') :
    state.membersViewMode==='grid' ? renderMembersGrid(list) : renderMembersTable(list);
  const target = container.querySelector('.members-grid') || container.querySelector('.table-wrap')?.closest('.card') || container.querySelector('.empty-state');
  if(target) target.outerHTML=newHtml;
}

document.addEventListener('change',function(e){
  if(e.target.id==='member-sort-select'){ state.memberSort=e.target.value; render(); return; }
});

function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('active');
}

/* Add member form submit */
document.addEventListener('submit',function(e){
  if(e.target.id==='add-member-form'){
    e.preventDefault();
    const name=document.getElementById('f-name').value.trim();
    const phone=document.getElementById('f-phone').value.trim();
    let ok=true;
    document.getElementById('err-name').classList.toggle('hidden', !!name); if(!name) ok=false;
    document.getElementById('f-name').classList.toggle('error', !name);
    const phoneValid=/^[0-9+\s]{7,15}$/.test(phone);
    document.getElementById('err-phone').classList.toggle('hidden', phoneValid);
    document.getElementById('f-phone').classList.toggle('error', !phoneValid);
    if(!phoneValid) ok=false;
    if(!ok){ toast('error','xCircle','Please fix the highlighted fields.'); return; }

    const card=document.getElementById('f-card').value.trim();
    const address=document.getElementById('f-address').value.trim()||'Not provided';
    const daily=parseFloat(document.getElementById('f-daily').value)||20;
    const joined=new Date(document.getElementById('f-joined').value || isoDate(TODAY));

    const newMember={
      id: Math.max(...MEMBERS.map(m=>m.id))+1,
      name, cardNumber:card, phone, address, dateJoined:joined,
      dailySavings:daily, totalSavings:0, totalDeposited:0, totalWithdrawn:0, daysPaid:0, daysMissed:0, daysSkipped:0,
      payments:{}, withdrawals:{}, paidToday:false, lastPaymentDate:null, missStreak:0, status:'Active'
    };
    MEMBERS.unshift(newMember);
    toast('success','checkCircle',`${name} registered successfully.`);
    go('members');
  }

  if(e.target.id==='login-form'){
    e.preventDefault();
    document.getElementById('login-view').style.display='none';
    document.getElementById('app-shell').classList.add('active');
    go('dashboard');
  }
});

/* password toggle */
document.getElementById('pw-toggle-btn').addEventListener('click',function(){
  const input=document.getElementById('login-password');
  const isPw=input.type==='password';
  input.type=isPw?'text':'password';
  this.innerHTML=icon(isPw?'eyeOff':'eye',17);
});
document.getElementById('pw-toggle-btn').innerHTML=icon('eye',17);

/* ---------- login left decorative bits ---------- */
document.getElementById('login-logo-slot').innerHTML=`${logoMark(40)}<div><div class="brand-name" style="font-size:18px;">Limol's Microfinance</div><div class="brand-sub">Savings Administration</div></div>`;
document.getElementById('login-security-note').innerHTML=`${icon('shieldCheck',15)} Secured admin access · Limol's Microfinance`;
(function(){
  const w=weeklySeries();
  const max=Math.max(...w.vals,1);
  const pts=w.vals.map((v,i)=>`${(i/(w.vals.length-1))*280},${60-(v/max)*54}`).join(' ');
  document.getElementById('login-growth-chart').innerHTML=`
  <div style="font-size:11px;color:#8393B4;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px;">This week's collections</div>
  <svg width="280" height="70" viewBox="0 0 280 70" fill="none">
    <polyline points="${pts}" fill="none" stroke="#7EB0FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,66 ${pts} 280,66" fill="rgba(126,176,255,0.12)" stroke="none"/>
  </svg>`;
})();

/* ---------- init ---------- */
render();
</script>
</body>
</html>
